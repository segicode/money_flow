    <div style="max-width:960px;" class="mx-auto">

        <div class="d-flex flex-column flex-md-row gap-4">

            <div data-js="dashboard" class="dashboard d-flex align-items-md-start">
                <div data-js="dashboard_card" class="sticky-md-top d-flex flex-column gap-3 w-100">
                    
                    <div>
                        <div class="text-secondary small">
                            今月の収入合計
                        </div>

                        <div data-js="income_total" class="fs-1 fw-bold text-success">
                            ¥0
                        </div>
                    </div>

                    <div data-js="work_list" class="d-flex flex-column gap-3"></div>

                    <div data-js="work_btn_list" class="d-flex flex-wrap gap-2"></div>
                </div>
                   
                <template data-template="work_item">
                    <div class="card shadow-sm">

                            <div class="card-body py-2 border-bottom">
                                <div class="d-flex justify-content-between align-items-center gap-2">

                                    <div class="rounded-circle"></div>

                                    <div class="d-flex flex-grow-1">
                                        <div class="title fw-bold"></div>
                                        <div class="count fs-bold ps-2"></div>
                                    </div>

                                    <div class="total fw-bold font-monospace text-primary"></div>

                                </div>
                            </div>

                            <div class="shift_list d-flex flex-wrap"></div>

                            <div class="bonus"></div>
                            
                    </div>
                </template>
                
                <template data-template="shift_item">
                    <div class="shift_item d-flex flex-column px-3 py-2 border-bottom">
                        <div class="d-flex mb-1 text-nowrap" style="min-height: 1.5rem;">
                            <div class="title small text-success text-nowrap"></div>
                            <div class="count small text-success text-nowrap ps-2"></div>
                        </div>
                        <div class="total font-monospace align-self-end"></div>
                    </div>
                </template>

                <template data-template="bonus_item">
                    <div class="card-body py-2 bg-warning-subtle">
                        <div class="d-flex justify-content-between align-items-center small">

                            <div>
                                🎁
                                <span class="text-warning-emphasis fw-semibold ms-1">
                                    ボーナス
                                </span>
                                <span class="text-secondary ms-2">
                                    （残業・賞与など）
                                </span>
                            </div>

                            <div class="bonus text-warning-emphasis font-monospace fw-semibold"></div>

                        </div>
                    </div>
                </template>

                

            </div>


            <div data-js="records" class="records align-items-center">

                <div class="d-flex align-items-center">
                    <hr class="flex-grow-1 border-top border-secondary"></hr>

                    <span class="mx-3 py-1 rounded-pill text-secondary small fw-bold">
                        取引履歴
                    </span>

                    <hr class="flex-grow-1 border-top border-secondary"></hr>
                </div>

                <div data-js="carender_list"></div>

                <template data-template="date_group">
                    <div class="date text-secondary small mt-4 mb-2"></div>
                    <div class="list"></div>
                </template>

                <template data-template="carender_item">
                    <div class="card mb-2">
                        <div class="card-body d-flex align-items-center">

                            <div class="rounded-circle" style="width: 1.5rem; height: 1.5rem;"></div>

                            <div class="flex-grow-1 ps-2">
                                <div class="work fw-semibold">???</div>
                            </div>

                            <div>
                                <div class="income fw-bold"></div>
                                <div class="income_bonus text-secondary small"></div>
                            </div>

                        </div>
                    </div>
                </template>

            </div>
        </div>
    </div>

    <script>

        function work_manager_render(){
            work_dashbord_render();
            work_btn_render();
            work_btn_active();
            carender_list_render();
            dashboard_position();
        }

        function work_dashbord_render(){
            data_js("work_manager", "income_total").textContent = "￥"+Number(app.work_data.get_month_total()).toLocaleString();

            const work_list = data_js("work_manager", "work_list");
            work_list.innerHTML = "";

            const work_item_template = data_template("work_manager", "work_item");
            const shift_item_template = data_template("work_manager", "shift_item");
            const bonus_item_template = data_template("work_manager", "bonus_item")

            Object.entries(app.work_data.work_obj).forEach(([work, work_obj]) =>{
                const work_total = Number(app.work_data.get_work_total(work));
                    //if(work_total < 1 || isNaN(work_total))return;

                const work_clone = work_item_template.content.cloneNode(true);
                work_clone.querySelector(".rounded-circle").style.backgroundColor = work_obj.color;
                work_clone.querySelector(".title").textContent = work;
                work_clone.querySelector(".count").textContent = 
                        app.work_data.get_work_data(work).length + "日";
                work_clone.querySelector(".total").textContent ="￥"+work_total.toLocaleString();
                const bonus = Number(app.work_data.get_work_bonus_total(work));
                    //if(bonus > 0){
                        const bonus_clone = bonus_item_template.content.cloneNode(true);
                        bonus_clone.querySelector(".bonus").textContent ="￥"+bonus.toLocaleString();
                        work_clone.querySelector(".bonus").appendChild(bonus_clone);
                    //}

                const shift_list = work_clone.querySelector(".shift_list");
                Object.keys(work_obj.shift_list).forEach(shift =>{
                    const shift_total = Number(app.work_data.get_shift_total(work, shift));
                    //if(shift_total < 1 || isNaN(shift_total))return;

                    const shift_clone = shift_item_template.content.cloneNode(true);
                    shift_clone.querySelector(".title").textContent = shift;
                    shift_clone.querySelector(".count").textContent = 
                            app.work_data.get_shift_data(work, shift).length + "日";
                    shift_clone.querySelector(".total").textContent = "￥"+shift_total.toLocaleString();
                    shift_list.appendChild(shift_clone);
                })
                work_list.appendChild(work_clone);
            })
        };

        function work_btn_render(){
            const work_btn_list = data_js("work_manager", "work_btn_list");
            work_btn_list.innerHTML = "";

            work_btn_list.appendChild(create_work_btn("すべて"));

            Object.keys(app.work_data.work_obj).forEach(work => {
                work_btn_list.appendChild(create_work_btn(work));
            });

            work_btn_list.appendChild(create_work_btn("???"));

                function create_work_btn(work) {

                    const button = document.createElement("button");

                    button.className = "filter_btn";
                    button.dataset.js = "work_btn";
                    button.dataset.work = work;
                    button.textContent = work;

                    button.onclick = () => {
                        app.work_data.chenge_work(work);
                    };

                    return button;
                }

        }

        function work_btn_active(){
            data_page("work_manager").querySelectorAll(".filter_btn").forEach(btn => {
                btn.classList.toggle(
                    "active",
                    btn.dataset.work === app.work_data.work_state
                );
            });
        }

        function carender_list_render(){
            const carender_data = app.work_data.get_work_data(app.work_data.work_state);
            const date_group = new Map();

            carender_data.forEach(row => {
                if(!date_group.has(row[1])){
                    date_group.set(row[1],[]);
                }

                date_group.get(row[1]).push(row);
            });

            const carender_list = data_js("work_manager", "carender_list");
            carender_list.innerHTML = "";

            const date_group_template = data_template("work_manager", "date_group");
            const item_template = data_template("work_manager", "carender_item");

            date_group.forEach((rows,date) =>{
                const date_group_clone = date_group_template.content.cloneNode(true);
                date_group_clone.querySelector(".date").textContent =
                    Number(date.split("/")[1])+"月"+Number(date.split("/")[2])+"日";

                const date_group_list = date_group_clone.querySelector(".list");

                rows.forEach(row =>{
                    const item_clone = item_template.content.cloneNode(true);

                    item_clone.querySelector(".rounded-circle").style.backgroundColor = row[4];
                    item_clone.querySelector(".work").textContent = row[2];
                    item_clone.querySelector(".income").textContent =
                        isNaN(row[5]) ? "???" : "￥"+Number(row[5]).toLocaleString();
                    if(row[6] !== "0" && row[6] !== "???")item_clone.querySelector(".income_bonus").textContent = row[6];
                    date_group_list.appendChild(item_clone);
                })
                carender_list.appendChild(date_group_clone);
            });
        }


        class work_data {
            constructor(data) {
                this.carender_data = data.carender_data;
                this.work_obj = data.work_obj
                this.work_state = "すべて";
            }
            
            get_month_data(){
                return this.carender_data.filter(row =>{
                    const date = new Date(row[1]);
                    return date.getFullYear() === app.year &&
                            date.getMonth()+1 === app.month
                });
            }

            get_month_total(){
                return this.get_month_data().reduce((sum, row) =>{
                    if(isNaN(Number(row[5])))return sum;
                    return sum + Number(row[5]);
                }, 0)
            }

            get_work_data(work){
                if(work === "すべて")return this.get_month_data();
                return this.get_month_data().filter(row=>
                    row[2] === work
                )
            }


            get_work_total(work){
                return this.get_work_data(work).reduce((sum, row) =>{
                    if(isNaN(Number(row[5])))return sum;
                    return sum + Number(row[5]);
                }, 0)
            }

            get_work_bonus_total(work){
                return this.get_work_data(work).reduce((sum, row) =>{
                    if(isNaN(Number(row[6])))return sum;
                    return sum + Number(row[6]);
                }, 0)
            }

            get_shift_data(work, shift){
                return this.get_work_data(work).filter(row =>{
                    return row[3] ?? "" === shift;
                })
            }

            get_shift_total(work, shift){
                return this.get_shift_data(work, shift).reduce((sum, row) =>{
                    if(isNaN(Number(row[5])))return sum;
                    return sum + Number(row[5]);
                }, 0)
            }

            chenge_work(work){
                this.work_state = work;
                work_btn_active();
                carender_list_render();
            }
        }

    </script>
