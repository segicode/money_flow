    <script>



        class work_data {
            constructor(data) {
                this.carender_data = data.carender_data;
                this.shift_data = data.shift_data
                this.shift = "すべて";
            }
            
            get_month_data(){
                return this.carender_data.filter(row =>{
                    const date = new Date(row[0]);
                    return date.getFullYear() === app.year &&
                            date.getMonth()+1 === app.month
                });
            }

            get_shift_data(shift){
                if(shift === "すべて")return this.get_month_data();
                return this.get_month_data().filter(row =>
                    row[1].startsWith(shift)
                );
            }

            get_shift_total(shift){
                this.get_shift_data(shift)
            }

            get_total_income(){
                return this.get_month_data().reduce((sum, row) =>{
                    const work = row[1].split(" ")[0];
                    if(!this.shift_data[work])return;
                    const income = this.shift_data[work] * row[2]
                    return sum+ income;
                }, 0);
            }

            get_income(work, hour){
                const work_data = this.shift_data[work];
                if(!work_data)throw new Error(work+"仕事データがありません。給料計算ができません。");
                return work_data.hour_wage * hour;
            }
            get_basic_income(work, shift){
                const work_data = this.shift_data[work];
                if(!work_data)throw new Error(work+"仕事データがありません。基本給の計算ができません。");
                const shift_data = work_data.shift_list[shift];
                if(!shift_data) throw new Error(shift+"シフトデータがありません。基本給の計算ができません");

                return work_data.hour_wage * shift_data.work_hour; 
            }

            get_records_item([date, title, hour]){
                const [work, shift] = title.split(" ");   
                if(!this.shift_data[work].shift_list[shift])throw new Error(title+"仕事データがありません。records_itemの配列を造れません。");             

                const color = this.shift_data[work].color;
                const income = this.get_income(work, hour);
                const income_bonus = Number(income) - Number(this.get_basic_income(work, shift));
                return [date, title, color, income, income_bonus];
            }

            get_dashbord(){

            }
        }

    </script>
