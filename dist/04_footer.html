<script>
    function state_render(){
        document.getElementById("pagetitle").textContent = app.state;

        document.querySelectorAll(".nav-btn").forEach(btn=>{
            btn.classList.toggle(
                "active",
                btn.dataset.state === app.state
            );
        });
        // ページ表示
        document.querySelectorAll(".page").forEach(p=>{

            p.classList.add("d-none");

        });
        document.getElementById("page-"+app.state).classList.remove("d-none");
    }
</script>
